    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Caveat:wght@400..700&display=swap" rel="stylesheet">

<style>

/* =========================
   BASIC PAGE
   ========================= */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background-image: url("anime-oriental-landscape.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    font-family: "Barlow Condensed", sans-serif;
    font-weight: 400;
    font-style: normal;

    min-height: 100vh;
}


/* =========================
   MAIN PANEL
   ========================= */

.main {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-top: 100px;
    margin-left: auto;
    margin-right: auto;

    width: 90%;
    max-width: 650px;

    padding: 30px;

    background-color: rgba(0, 0, 91, 0.48);

    backdrop-filter: blur(1px);
    -webkit-backdrop-filter: blur(1px);

    border-radius: 50px;
}


/* =========================
   TEXT CONTAINER
   ========================= */

.text {
    text-align: center;
    margin: 20px;
    padding: 15px;

    color: white;

    width: 100%;
}


/* =========================
   NAME
   ========================= */

.text h1 {
    color: #dff6ff;

    font-size: 50px;

    margin-top: 10px;
    margin-bottom: 35px;

    text-shadow:
        0 0 8px #4db8ff,
        0 0 18px #4db8ff,
        0 0 30px #8b5cff;
}


/* =========================
   INTRO TEXT
   ========================= */

.p1 {
    width: 100%;
    margin: auto;

    color: #ffffff;

    padding: 10px;

    font-size: 20px;
    line-height: 1.3;

    white-space: normal;
    overflow-wrap: break-word;

    text-shadow:
        0 0 6px #315cff,
        0 0 12px #315cff;
}


/* =========================
   CONNECT TEXT
   ========================= */

.p2 {
    font-size: 23px;

    font-family: "Caveat", cursive;

    margin-top: 25px;
    margin-bottom: 15px;

    color: #f0eaff;

    text-shadow:
        0 0 8px #6d7cff,
        0 0 16px #b05cff;
}


/* =========================
   SOCIAL ICONS
   ========================= */

.icons {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-top: 7px;
}

.icons i {
    width: 25px;

    margin: 10px;

    font-size: 25px;

    color: #dff6ff;

    text-shadow:
        0 0 6px #4db8ff,
        0 0 14px #4db8ff;

    transition: 0.3s ease;
}


/* =========================
   ICON HOVER
   ========================= */

.icons i:hover {
    color: #ffb4f5;

    text-shadow:
        0 0 6px #ff7de3,
        0 0 15px #ff4fd8,
        0 0 25px #b05cff;

    transform: translateY(-2px);
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    body {
        background-position: center;
        background-attachment: scroll;
    }

    .main {
        margin-top: 50px;

        width: 92%;

        padding: 20px;

        border-radius: 30px;
    }

    .text {
        margin: 10px;
        padding: 10px;
    }

    .text h1 {
        font-size: 32px;

        margin-bottom: 25px;
    }

    .p1 {
        font-size: 16px;
    }

    .p2 {
        font-size: 18px;
    }

    .icons i {
        width: 22px;

        font-size: 22px;

        margin: 9px;
    }
}

</style>
</head>


<body>

</body>
